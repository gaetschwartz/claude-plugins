[project]
name = "guardrails"
version = "0.2.0"
description = "Claude Code PreToolUse guardrails for Bash: data-driven rules, modes and presets; no runtime dependencies"
requires-python = ">=3.9"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ty.environment]
python-version = "3.9"
extra-paths = ["hooks"]
