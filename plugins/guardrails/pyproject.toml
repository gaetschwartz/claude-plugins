[project]
name = "guardrails"
version = "0.12.0"
description = "Claude Code PreToolUse guardrails for Bash: data-driven rules, modes and presets; commands are parsed in process by ast-grep-py from a managed, automatically installed runtime"
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.per-file-target-version]
"lib/bootstrap.py" = "py39"
"tests/test_bootstrap.py" = "py39"

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["lib"]
