[project]
name = "guardrails"
version = "0.10.1"
description = "Claude Code PreToolUse guardrails for Bash: data-driven rules, modes and presets; commands are parsed by the standalone ast-grep binary (npm package, else a hash-checked wheel)"
requires-python = ">=3.9"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ty.environment]
python-version = "3.9"
extra-paths = ["lib"]
